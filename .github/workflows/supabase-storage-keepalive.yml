name: Check Supabase evidence storage

on:
  schedule:
    # Every third day at 06:23 UTC. The check is metadata-only and never reads or writes evidence files.
    - cron: "23 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-evidence-storage:
    name: Check private evidence storage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_STORAGE_BUCKET: ${{ secrets.SUPABASE_STORAGE_BUCKET }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Supabase evidence storage
        run: pnpm storage:keepalive
